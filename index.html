<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅先クイズ会">
<meta name="theme-color" content="#ffffff">
<title>旅先クイズ会 — 参加者記録</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --blue:#1a73e8;--blue-light:#e8f0fe;--blue-dark:#1557b0;
  --green:#34a853;--green-light:#e6f4ea;
  --g100:#f8f9fa;--g200:#e8eaed;--g500:#9aa0a6;--g700:#5f6368;--g900:#202124;
  --red:#ea4335;--radius:12px;--radius-sm:8px;
  --col-w:72px;--row-h:52px;--hdr-h:44px;--label-w:52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--g100);color:var(--g900);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--g200);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:20}
.topbar-title{font-size:16px;font-weight:600}
.badge{background:var(--blue-light);color:var(--blue);font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--g200);flex-shrink:0;z-index:19}
.tab{flex:1;padding:12px 0;text-align:center;font-size:14px;font-weight:500;color:var(--g500);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* pages */
.page{display:none;flex:1;overflow:hidden;flex-direction:column}
.page.active{display:flex}
.scroll-page{display:none;flex:1;overflow-y:auto}
.scroll-page.active{display:block}

/* toolbar */
.toolbar{background:#fff;border-bottom:1px solid var(--g200);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-add{background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);padding:8px 14px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-add:active{background:var(--blue-dark)}
.toolbar-info{font-size:12px;color:var(--g500);flex:1}
.btn-save{background:var(--green-light);color:var(--green);border:1.5px solid var(--green);border-radius:var(--radius-sm);padding:8px 14px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}

/* table */
.table-area{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.table-wrap{display:inline-flex;min-width:100%;min-height:100%}

/* label column */
.label-col{width:var(--label-w);flex-shrink:0;position:sticky;left:0;z-index:10;background:#fff;border-right:2px solid var(--g200);display:flex;flex-direction:column}
.lc{height:var(--row-h);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--g200);font-size:10px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.04em;text-align:center;line-height:1.3;padding:2px}
.lc.hdr{height:var(--hdr-h);font-size:11px}

/* person cols */
.person-col{flex-shrink:0;width:var(--col-w);border-right:1px solid var(--g200);display:flex;flex-direction:column}
.ph{height:var(--hdr-h);background:var(--g100);border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.pnum{font-size:12px;font-weight:700;color:var(--g700)}
.person-col.done .ph{background:var(--green-light)}
.person-col.done .pnum{color:var(--green)}
.pc{height:var(--row-h);border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:center;padding:4px}
.cell-btn{width:100%;height:36px;border:1.5px solid var(--g200);border-radius:var(--radius-sm);background:var(--g100);font-size:11px;color:var(--g700);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.cell-btn.filled{background:var(--blue-light);border-color:var(--blue);color:var(--blue);font-weight:600}
.del-btn{background:none;border:none;color:var(--g500);cursor:pointer;padding:2px;line-height:0;flex-shrink:0}

/* add col hint */
.add-hint{flex-shrink:0;width:48px;display:flex;align-items:flex-start;padding-top:6px;justify-content:center}

/* modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-height:85dvh;overflow-y:auto}
.sheet-title{font-size:15px;font-weight:600;text-align:center;margin-bottom:3px}
.sheet-sub{font-size:12px;color:var(--g500);text-align:center;margin-bottom:16px}
.pick-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.pick-btn{background:var(--g100);border:1.5px solid var(--g200);border-radius:99px;padding:9px 16px;font-size:15px;color:var(--g700);cursor:pointer;font-family:inherit}
.pick-btn.sel{background:var(--blue-light);border-color:var(--blue);color:var(--blue);font-weight:700}
.sheet-actions{display:flex;gap:10px}
.btn-confirm{flex:1;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-cancel{background:none;border:1.5px solid var(--g200);border-radius:var(--radius);padding:14px 18px;font-size:15px;color:var(--g700);font-family:inherit;cursor:pointer}

/* inner pages */
.inner{padding:16px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{background:#fff;border-radius:var(--radius);padding:14px 16px}
.sc.wide{grid-column:span 2}
.sl{font-size:12px;color:var(--g500);margin-bottom:4px}
.sv{font-size:28px;font-weight:700}
.bc{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px}
.bt{font-size:13px;font-weight:600;color:var(--g700);margin-bottom:12px}
.br{margin-bottom:10px}
.brl{display:flex;justify-content:space-between;font-size:13px;color:var(--g700);margin-bottom:4px}
.brt{height:8px;background:var(--g200);border-radius:99px;overflow:hidden}
.brf{height:100%;background:var(--blue);border-radius:99px}
.pub-btn{width:100%;color:#fff;border:none;border-radius:var(--radius);padding:16px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:12px}
.pub-btn:disabled{background:var(--g200);color:var(--g500);cursor:not-allowed}

/* toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(32,33,36,.9);color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">旅先クイズ会</div>
  <div class="badge"><span id="hdr-count">0</span> 名</div>
</div>
<div class="tabs">
  <button class="tab active" onclick="showTab('record')">記録</button>
  <button class="tab" onclick="showTab('stats')">集計</button>
  <button class="tab" onclick="showTab('publish')">発行</button>
</div>

<!-- 記録 -->
<div class="page active" id="page-record">
  <div class="toolbar">
    <button class="btn-add" onclick="addPerson()">＋ 人を追加</button>
    <span class="toolbar-info" id="toolbar-info">0名 記入中</span>
    <button class="btn-save" onclick="saveAll()">✓ 保存</button>
  </div>
  <div class="table-area" id="table-area">
    <div class="table-wrap" id="table-wrap">
      <div class="label-col">
        <div class="lc hdr">#</div>
        <div class="lc">性別</div>
        <div class="lc">年代</div>
        <div class="lc">国・地域</div>
      </div>
      <div id="data-cols"></div>
      <div class="add-hint">
        <button style="background:var(--g200);border:none;border-radius:50%;width:34px;height:34px;font-size:20px;color:var(--g700);cursor:pointer;margin-top:5px" onclick="addPerson()">＋</button>
      </div>
    </div>
  </div>
</div>

<!-- 集計 -->
<div class="scroll-page" id="page-stats">
  <div class="inner">
    <div class="stats-grid">
      <div class="sc wide"><div class="sl">合計参加者（保存済）</div><div class="sv" id="s-total">0</div></div>
      <div class="sc"><div class="sl">男性</div><div class="sv" id="s-male">0</div></div>
      <div class="sc"><div class="sl">女性</div><div class="sv" id="s-female">0</div></div>
      <div class="sc"><div class="sl">日本国内</div><div class="sv" id="s-dom">0</div></div>
      <div class="sc"><div class="sl">海外</div><div class="sv" id="s-ovs">0</div></div>
    </div>
    <div class="bc"><div class="bt">年代別</div><div id="age-bars"></div></div>
    <div class="bc"><div class="bt">地域別</div><div id="region-bars"></div></div>
  </div>
</div>

<!-- 発行 -->
<div class="scroll-page" id="page-publish">
  <div class="inner">
    <div class="sc" style="margin-bottom:16px"><div class="sl" style="margin-bottom:4px">保存済み参加者</div><div style="font-size:32px;font-weight:700" id="p-count">0 名</div></div>
    <button class="pub-btn" style="background:var(--green)" id="publish-btn" disabled onclick="publishPDF()">📄 PDFを発行する</button>
    <button class="pub-btn" style="background:var(--blue)" id="csv-btn" disabled onclick="publishCSV()">📊 CSVをダウンロードする</button>
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--g200)">
      <button style="width:100%;background:none;border:1.5px solid var(--red);border-radius:var(--radius);padding:12px;font-size:14px;color:var(--red);font-family:inherit;cursor:pointer" onclick="clearAll()">すべてのデータを削除する</button>
    </div>
  </div>
</div>

<!-- picker modal -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-title" id="pk-title"></div>
    <div class="sheet-sub" id="pk-sub"></div>
    <div class="pick-grid" id="pk-grid"></div>
    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closePicker()">キャンセル</button>
      <button class="btn-confirm" onclick="confirmPicker()">決定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const AGES=['10代','20代','30代','40代','50代','60代','70代以上'];
const REGIONS=['日本国内','アジア・オセアニア','欧州','北米','中南米','中東・アフリカ'];
const ROWS=['gender','age','region'];
const OPTS={gender:['男','女'],age:AGES,region:REGIONS};
const LABEL={gender:'性別',age:'年代',region:'国・地域'};
const SHORT={gender:v=>v, age:v=>v, region:v=>({'日本国内':'国内','アジア・オセアニア':'アジア','欧州':'欧州','北米':'北米','中南米':'中南米','中東・アフリカ':'中東AF'}[v]||v)};

let persons=JSON.parse(localStorage.getItem('tqk2_persons')||'[]');
let pkId=null,pkRow=null,pkVal=null;

function showTab(id){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['record','stats','publish'][i]===id));
  document.querySelectorAll('.page,.scroll-page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  if(id==='stats')renderStats();
  if(id==='publish')renderPublish();
}

function addPerson(){
  persons.push({id:Date.now(),gender:null,age:null,region:null,saved:false});
  renderCols();
  setTimeout(()=>{const a=document.getElementById('table-area');a.scrollLeft=a.scrollWidth;},60);
}

function deletePerson(id){
  if(!confirm('削除しますか？'))return;
  persons=persons.filter(p=>p.id!==id);
  save();renderCols();updateHeader();
}

function saveAll(){
  const done=persons.filter(p=>p.gender&&p.age&&p.region);
  if(!done.length){showToast('記入完了の人がいません');return;}
  done.forEach(p=>p.saved=true);
  save();updateHeader();renderCols();
  showToast(done.length+'名を保存しました ✓');
}

function clearAll(){
  if(!confirm('すべての記録を削除しますか？この操作は元に戻せません。'))return;
  persons=[];save();renderCols();updateHeader();renderPublish();
  showToast('削除しました');
}

function save(){localStorage.setItem('tqk2_persons',JSON.stringify(persons));}

function updateHeader(){
  document.getElementById('hdr-count').textContent=persons.filter(p=>p.saved&&p.gender&&p.age&&p.region).length;
}

function renderCols(){
  const dc=document.getElementById('data-cols');
  dc.innerHTML='';
  persons.forEach((p,i)=>{
    const col=document.createElement('div');
    const complete=p.gender&&p.age&&p.region;
    col.className='person-col'+(complete?' done':'')+(p.saved?' saved':'');
    col.innerHTML=
      `<div class="ph">
        <span class="pnum">${i+1}${p.saved?'✓':''}</span>
        <button class="del-btn" onclick="deletePerson(${p.id})">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>`+
      ROWS.map(row=>`<div class="pc"><button class="cell-btn${p[row]?' filled':''}" onclick="openPicker(${p.id},'${row}')">${p[row]?SHORT[row](p[row]):'—'}</button></div>`).join('');
    dc.appendChild(col);
  });
  const done=persons.filter(p=>p.gender&&p.age&&p.region).length;
  document.getElementById('toolbar-info').textContent=`${persons.length}名 記入中 / 完了${done}名`;
}

function openPicker(id,row){
  pkId=id;pkRow=row;pkVal=null;
  const p=persons.find(x=>x.id===id);
  pkVal=p?p[row]:null;
  const idx=persons.indexOf(p)+1;
  document.getElementById('pk-title').textContent=LABEL[row]+'を選ぶ';
  document.getElementById('pk-sub').textContent='参加者 '+idx+'番';
  document.getElementById('pk-grid').innerHTML=OPTS[row].map(o=>`<button class="pick-btn${pkVal===o?' sel':''}" onclick="pickVal(this,'${o}')">${o}</button>`).join('');
  document.getElementById('overlay').classList.add('open');
}

function pickVal(btn,val){
  pkVal=val;
  document.querySelectorAll('.pick-btn').forEach(b=>b.classList.toggle('sel',b===btn));
}

function confirmPicker(){
  if(!pkVal){closePicker();return;}
  const p=persons.find(x=>x.id===pkId);
  if(p){
    p[pkRow]=pkVal;
    p.saved=false; // 再保存が必要
    const nextRow=ROWS.find(r=>!p[r]);
    renderCols();
    closePicker();
    if(nextRow)setTimeout(()=>openPicker(pkId,nextRow),180);
  }
}

function closePicker(){
  document.getElementById('overlay').classList.remove('open');
  pkId=null;pkRow=null;pkVal=null;
}

function savedEntries(){return persons.filter(p=>p.saved&&p.gender&&p.age&&p.region);}

function renderStats(){
  const e=savedEntries(),total=e.length;
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-male').textContent=e.filter(x=>x.gender==='男').length;
  document.getElementById('s-female').textContent=e.filter(x=>x.gender==='女').length;
  document.getElementById('s-dom').textContent=e.filter(x=>x.region==='日本国内').length;
  document.getElementById('s-ovs').textContent=e.filter(x=>x.region!=='日本国内').length;
  document.getElementById('age-bars').innerHTML=total?AGES.map(a=>{const n=e.filter(x=>x.age===a).length,p=Math.round(n/total*100);return n?`<div class="br"><div class="brl"><span>${a}</span><span>${n}名 (${p}%)</span></div><div class="brt"><div class="brf" style="width:${p}%"></div></div></div>`:''}).join(''):'<div style="color:var(--g500);font-size:13px">データなし</div>';
  const rb=REGIONS.map(r=>{const n=e.filter(x=>x.region===r).length,p=Math.round(n/total*100);return n?`<div class="br"><div class="brl"><span>${r}</span><span>${n}名 (${p}%)</span></div><div class="brt"><div class="brf" style="width:${p}%"></div></div></div>`:''}).join('');
  document.getElementById('region-bars').innerHTML=rb||'<div style="color:var(--g500);font-size:13px">データなし</div>';
}

function renderPublish(){
  const n=savedEntries().length;
  document.getElementById('p-count').textContent=n+' 名';
  document.getElementById('publish-btn').disabled=!n;
  document.getElementById('csv-btn').disabled=!n;
}

function publishCSV(){
  const e=savedEntries();
  const BOM='\uFEFF',h=['番号','性別','年代','国・地域'];
  const csv=BOM+[h,...e.map((x,i)=>[i+1,x.gender,x.age,x.region])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='tabisaki-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();showToast('CSVをダウンロードしました');
}

function publishPDF(){
  if(typeof window.jspdf==='undefined'){showToast('PDF読込中…再度タップ');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
  const e=savedEntries(),now=new Date(),total=e.length;
  doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text('Tabisaki Quiz Kai',20,24);
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(100);
  doc.text('Participant Report  /  '+now.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}),20,32);
  doc.setTextColor(0);doc.setFontSize(13);doc.setFont('helvetica','bold');doc.text('Summary',20,46);
  doc.setFont('helvetica','normal');doc.setFontSize(11);
  const male=e.filter(x=>x.gender==='男').length,female=total-male,dom=e.filter(x=>x.region==='日本国内').length,ovs=total-dom;
  const rows=[['Total',String(total)],['Male',String(male)+(total?'  ('+Math.round(male/total*100)+'%)':'')],['Female',String(female)+(total?'  ('+Math.round(female/total*100)+'%)':'')],['Domestic',String(dom)],['Overseas',String(ovs)]];
  REGIONS.filter(r=>r!=='日本国内').forEach(r=>{const n=e.filter(x=>x.region===r).length;if(n)rows.push(['  '+r,String(n)]);});
  rows.push(['---','---']);
  AGES.forEach(a=>{const n=e.filter(x=>x.age===a).length;if(n)rows.push([a,String(n)]);});
  let y=54;
  rows.forEach(([l,v])=>{if(l==='---'){doc.setLineWidth(0.3);doc.line(20,y,190,y);y+=5;return;}doc.text(l,25,y);doc.text(v,130,y);y+=7;});
  y+=6;doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('Participant Log',20,y);y+=7;
  doc.setFontSize(10);doc.setFont('helvetica','bold');
  doc.text('#',20,y);doc.text('Gender',35,y);doc.text('Age',60,y);doc.text('Region',90,y);y+=4;
  doc.setLineWidth(0.3);doc.line(20,y,190,y);y+=6;doc.setFont('helvetica','normal');
  e.forEach((x,i)=>{if(y>275){doc.addPage();y=20;}doc.text(String(i+1),20,y);doc.text(x.gender,35,y);doc.text(x.age,60,y);doc.text(x.region,90,y);y+=6;});
  doc.save('tabisaki-'+now.toISOString().slice(0,10)+'.pdf');
  showToast('PDFを発行しました');
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),2500);
}

renderCols();updateHeader();
</script>
</body>
</html>

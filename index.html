<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅先クイズ会">
<meta name="theme-color" content="#ffffff">
<title>旅先クイズ会 — 参加者記録</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --blue:#1a73e8;--blue-light:#e8f0fe;--blue-dark:#1557b0;
  --green:#34a853;--green-light:#e6f4ea;
  --g100:#f8f9fa;--g200:#e8eaed;--g500:#9aa0a6;--g700:#5f6368;--g900:#202124;
  --red:#ea4335;--radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--g100);color:var(--g900);height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.topbar{background:#fff;border-bottom:1px solid var(--g200);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:600}
.badge{background:var(--blue-light);color:var(--blue);font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px}

.tabs{display:flex;background:#fff;border-bottom:1px solid var(--g200);flex-shrink:0}
.tab{flex:1;padding:12px 0;text-align:center;font-size:14px;font-weight:500;color:var(--g500);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

.page{display:none;flex:1;overflow:hidden;flex-direction:column}
.page.active{display:flex}
.scroll-page{display:none;flex:1;overflow-y:auto}
.scroll-page.active{display:block}

/* toolbar */
.rec-toolbar{background:#fff;border-bottom:1px solid var(--g200);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.toolbar-info{font-size:13px;color:var(--g500);flex:1}
.btn-save{background:var(--green-light);color:var(--green);border:1.5px solid var(--green);border-radius:var(--radius-sm);padding:9px 16px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-clear-unsaved{background:none;border:1.5px solid var(--g200);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;color:var(--g700);font-family:inherit;cursor:pointer}

/* scroll container */
.rec-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:40px}

/* person card */
.person-card{background:#fff;border-radius:var(--radius);margin:8px 12px 0;padding:11px 13px;border:1.5px solid var(--g200);transition:border-color .12s}
.person-card.done{border-color:#b2dfb2}
.person-card.saved{border-color:var(--green);background:var(--green-light)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.card-num{font-size:12px;font-weight:700;color:var(--g500)}
.card-num.done{color:var(--green)}
.card-row{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.card-row:last-child{margin-bottom:0}
.row-label{font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;width:30px;flex-shrink:0;text-align:right;letter-spacing:.04em}
.btn-group{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.opt{background:var(--g100);border:1.5px solid var(--g200);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--g700);cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .1s}
.opt.sel{background:var(--blue-light);border-color:var(--blue);color:var(--blue);font-weight:600}
.opt.sm{padding:5px 9px;font-size:12px}
.anchor-marker{height:0;overflow:hidden}

/* 目次 right rail */
.toc{position:fixed;right:4px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none}
.toc.visible{pointer-events:auto}
.toc-btn{background:rgba(26,115,232,.85);color:#fff;border:none;border-radius:6px;width:32px;padding:3px 0;font-size:10px;font-weight:700;cursor:pointer;text-align:center;line-height:1.3;font-family:inherit;transition:background .1s}
.toc-btn:active{background:var(--blue-dark)}

/* stats/publish */
.inner{padding:16px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{background:#fff;border-radius:var(--radius);padding:14px 16px}
.sc.wide{grid-column:span 2}
.sl{font-size:12px;color:var(--g500);margin-bottom:4px}
.sv{font-size:28px;font-weight:700}
.bc{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px}
.bt{font-size:13px;font-weight:600;color:var(--g700);margin-bottom:12px}
.br{margin-bottom:10px}
.brl{display:flex;justify-content:space-between;font-size:13px;color:var(--g700);margin-bottom:4px}
.brt{height:8px;background:var(--g200);border-radius:99px;overflow:hidden}
.brf{height:100%;background:var(--blue);border-radius:99px}
.pub-btn{width:100%;color:#fff;border:none;border-radius:var(--radius);padding:16px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;margin-bottom:12px}
.pub-btn:disabled{background:var(--g200);color:var(--g500);cursor:not-allowed}

.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(32,33,36,.9);color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">旅先クイズ会</div>
  <div class="badge"><span id="hdr-count">0</span> 名</div>
</div>
<div class="tabs">
  <button class="tab active" onclick="showTab('record')">記録</button>
  <button class="tab" onclick="showTab('stats')">集計</button>
  <button class="tab" onclick="showTab('publish')">発行</button>
</div>

<!-- 記録 -->
<div class="page active" id="page-record">
  <div class="rec-toolbar">
    <span class="toolbar-info" id="toolbar-info">0名 / 完了0名</span>
    <button class="btn-clear-unsaved" onclick="clearUnsaved()">未入力クリア</button>
    <button class="btn-save" onclick="saveAll()">✓ 保存</button>
  </div>
  <div class="rec-scroll" id="rec-scroll">
    <div id="card-list"></div>
    <div style="height:24px"></div>
  </div>
</div>

<!-- 目次 -->
<div class="toc" id="toc"></div>

<!-- 集計 -->
<div class="scroll-page" id="page-stats">
  <div class="inner">
    <div class="stats-grid">
      <div class="sc wide"><div class="sl">合計参加者（保存済）</div><div class="sv" id="s-total">0</div></div>
      <div class="sc"><div class="sl">男性</div><div class="sv" id="s-male">0</div></div>
      <div class="sc"><div class="sl">女性</div><div class="sv" id="s-female">0</div></div>
      <div class="sc"><div class="sl">日本国内</div><div class="sv" id="s-dom">0</div></div>
      <div class="sc"><div class="sl">海外</div><div class="sv" id="s-ovs">0</div></div>
    </div>
    <div class="bc"><div class="bt">年代別</div><div id="age-bars"></div></div>
    <div class="bc"><div class="bt">地域別</div><div id="region-bars"></div></div>
  </div>
</div>

<!-- 発行 -->
<div class="scroll-page" id="page-publish">
  <div class="inner">
    <div class="sc" style="margin-bottom:16px"><div class="sl" style="margin-bottom:4px">保存済み参加者</div><div style="font-size:32px;font-weight:700" id="p-count">0 名</div></div>
    <button class="pub-btn" style="background:var(--green)" id="publish-btn" disabled onclick="publishPDF()">📄 PDFを発行する</button>
    <button class="pub-btn" style="background:var(--blue)" id="csv-btn" disabled onclick="publishCSV()">📊 CSVをダウンロードする</button>
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--g200)">
      <button style="width:100%;background:none;border:1.5px solid var(--red);border-radius:var(--radius);padding:12px;font-size:14px;color:var(--red);font-family:inherit;cursor:pointer" onclick="clearAll()">すべてのデータを削除する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOTAL = 600;
const AGES = ['10代','20代','30代','40代','50代','60代','70代以上'];
const REGIONS = ['日本国内','アジア・オセアニア','欧州','北米','中南米','中東・アフリカ'];
const REG_SHORT = {'日本国内':'国内','アジア・オセアニア':'アジア','欧州':'欧州','北米':'北米','中南米':'中南米','中東・アフリカ':'中東AF'};

// Load or init 600 persons
let persons = JSON.parse(localStorage.getItem('tqk5_persons') || 'null');
if (!persons || persons.length !== TOTAL) {
  const old = persons || [];
  persons = Array.from({length: TOTAL}, (_, i) => {
    return old[i] || {id: i+1, gender: null, age: null, region: null, saved: false};
  });
  save();
}

function showTab(id) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['record','stats','publish'][i] === id));
  document.querySelectorAll('.page,.scroll-page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.getElementById('toc').classList.toggle('visible', id === 'record');
  if (id === 'stats') renderStats();
  if (id === 'publish') renderPublish();
}

function pick(id, field, val) {
  const p = persons[id - 1];
  if (!p) return;
  p[field] = (p[field] === val) ? null : val; // toggle off if same
  p.saved = false;
  save();
  updateCard(id);
  updateToolbar();
}

function updateCard(id) {
  const p = persons[id - 1];
  const el = document.getElementById('card-' + id);
  if (!el) return;
  const complete = p.gender && p.age && p.region;
  el.className = 'person-card' + (complete ? ' done' : '') + (p.saved ? ' saved' : '');

  el.querySelector('.card-num').className = 'card-num' + (complete ? ' done' : '');
  el.querySelector('.card-num').textContent = id + '番' + (p.saved ? ' ✓' : '');

  // update gender buttons
  el.querySelectorAll('[data-field="gender"] .opt').forEach(b => {
    b.classList.toggle('sel', b.dataset.val === p.gender);
  });
  el.querySelectorAll('[data-field="age"] .opt').forEach(b => {
    b.classList.toggle('sel', b.dataset.val === p.age);
  });
  el.querySelectorAll('[data-field="region"] .opt').forEach(b => {
    b.classList.toggle('sel', b.dataset.val === p.region);
  });
}

function updateToolbar() {
  const done = persons.filter(p => p.gender && p.age && p.region).length;
  const saved = persons.filter(p => p.saved).length;
  document.getElementById('toolbar-info').textContent = `完了${done}名 / 保存済${saved}名`;
  document.getElementById('hdr-count').textContent = saved;
}

function saveAll() {
  const done = persons.filter(p => p.gender && p.age && p.region);
  if (!done.length) { showToast('記入完了の人がいません'); return; }
  done.forEach(p => p.saved = true);
  save();
  updateToolbar();
  // re-render saved state on all cards
  persons.forEach(p => {
    const el = document.getElementById('card-' + p.id);
    if (!el) return;
    const complete = p.gender && p.age && p.region;
    el.className = 'person-card' + (complete ? ' done' : '') + (p.saved ? ' saved' : '');
    el.querySelector('.card-num').textContent = p.id + '番' + (p.saved ? ' ✓' : '');
  });
  showToast(done.length + '名を保存しました ✓');
}

function clearUnsaved() {
  if (!confirm('未保存の入力をクリアしますか？')) return;
  persons.forEach(p => { if (!p.saved) { p.gender = null; p.age = null; p.region = null; } });
  save();
  persons.forEach(p => { if (!p.saved) updateCard(p.id); });
  updateToolbar();
  showToast('未保存の入力をクリアしました');
}

function clearAll() {
  if (!confirm('すべての記録を削除しますか？この操作は元に戻せません。')) return;
  persons.forEach(p => { p.gender = null; p.age = null; p.region = null; p.saved = false; });
  save();
  persons.forEach(p => updateCard(p.id));
  updateToolbar();
  renderPublish();
  showToast('削除しました');
}

function save() { localStorage.setItem('tqk5_persons', JSON.stringify(persons)); }

// Build all 600 cards once
function renderAllCards() {
  const list = document.getElementById('card-list');
  const frag = document.createDocumentFragment();

  persons.forEach((p, i) => {
    const num = i + 1;

    // Anchor marker every 50
    if (num === 1 || num % 50 === 0) {
      const anchor = document.createElement('div');
      anchor.className = 'anchor-marker';
      anchor.id = 'anchor-' + num;
      frag.appendChild(anchor);
    }

    const card = document.createElement('div');
    card.id = 'card-' + num;
    const complete = p.gender && p.age && p.region;
    card.className = 'person-card' + (complete ? ' done' : '') + (p.saved ? ' saved' : '');

    card.innerHTML = `
      <div class="card-header">
        <span class="card-num${complete?' done':''}">${num}番${p.saved?' ✓':''}</span>
      </div>
      <div class="card-row">
        <div class="row-label">性別</div>
        <div class="btn-group" data-field="gender">
          ${['男','女'].map(v=>`<button class="opt${p.gender===v?' sel':''}" data-val="${v}" onclick="pick(${num},'gender','${v}')">${v}</button>`).join('')}
        </div>
      </div>
      <div class="card-row">
        <div class="row-label">年代</div>
        <div class="btn-group" data-field="age">
          ${AGES.map(v=>`<button class="opt${p.age===v?' sel':''}" data-val="${v}" onclick="pick(${num},'age','${v}')">${v}</button>`).join('')}
        </div>
      </div>
      <div class="card-row">
        <div class="row-label">地域</div>
        <div class="btn-group" data-field="region">
          ${REGIONS.map(v=>`<button class="opt sm${p.region===v?' sel':''}" data-val="${v}" onclick="pick(${num},'region','${v}')">${REG_SHORT[v]}</button>`).join('')}
        </div>
      </div>`;
    frag.appendChild(card);
  });

  list.appendChild(frag);
}

// Build TOC
function buildToc() {
  const toc = document.getElementById('toc');
  toc.innerHTML = '';
  [1,50,100,150,200,250,300,350,400,450,500,550,600].forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'toc-btn';
    btn.textContent = n;
    btn.onclick = () => jumpTo(n);
    toc.appendChild(btn);
  });
  toc.classList.add('visible');
}

function jumpTo(num) {
  const anchor = document.getElementById('anchor-' + num);
  if (anchor) anchor.scrollIntoView({behavior: 'smooth', block: 'start'});
}

function savedEntries() { return persons.filter(p => p.saved && p.gender && p.age && p.region); }

function renderStats() {
  const e = savedEntries(), total = e.length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-male').textContent = e.filter(x => x.gender === '男').length;
  document.getElementById('s-female').textContent = e.filter(x => x.gender === '女').length;
  document.getElementById('s-dom').textContent = e.filter(x => x.region === '日本国内').length;
  document.getElementById('s-ovs').textContent = e.filter(x => x.region !== '日本国内').length;
  document.getElementById('age-bars').innerHTML = total
    ? AGES.map(a => { const n = e.filter(x => x.age === a).length, p = Math.round(n/total*100); return n ? `<div class="br"><div class="brl"><span>${a}</span><span>${n}名(${p}%)</span></div><div class="brt"><div class="brf" style="width:${p}%"></div></div></div>` : ''; }).join('')
    : '<div style="color:var(--g500);font-size:13px">データなし</div>';
  const rb = REGIONS.map(r => { const n = e.filter(x => x.region === r).length, p = total ? Math.round(n/total*100) : 0; return n ? `<div class="br"><div class="brl"><span>${r}</span><span>${n}名(${p}%)</span></div><div class="brt"><div class="brf" style="width:${p}%"></div></div></div>` : ''; }).join('');
  document.getElementById('region-bars').innerHTML = rb || '<div style="color:var(--g500);font-size:13px">データなし</div>';
}

function renderPublish() {
  const n = savedEntries().length;
  document.getElementById('p-count').textContent = n + ' 名';
  document.getElementById('publish-btn').disabled = !n;
  document.getElementById('csv-btn').disabled = !n;
}

function publishCSV() {
  const e = savedEntries();
  const BOM = '\uFEFF', h = ['番号','性別','年代','国・地域'];
  const csv = BOM + [h, ...e.map((x,i) => [i+1, x.gender, x.age, x.region])].map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8;'}));
  a.download = 'tabisaki-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  showToast('CSVをダウンロードしました');
}

function publishPDF() {
  if (typeof window.jspdf === 'undefined') { showToast('PDF読込中…再度タップ'); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'p', unit:'mm', format:'a4'});
  const e = savedEntries(), now = new Date(), total = e.length;
  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.text('Tabisaki Quiz Kai', 20, 24);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(100);
  doc.text('Participant Report  /  ' + now.toLocaleDateString('ja-JP', {year:'numeric',month:'long',day:'numeric'}), 20, 32);
  doc.setTextColor(0); doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.text('Summary', 20, 46);
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  const male = e.filter(x=>x.gender==='男').length, female = total-male, dom = e.filter(x=>x.region==='日本国内').length, ovs = total-dom;
  const rows = [['Total',String(total)],['Male',String(male)+(total?'  ('+Math.round(male/total*100)+'%)':'')],['Female',String(female)+(total?'  ('+Math.round(female/total*100)+'%)':'')],['Domestic',String(dom)],['Overseas',String(ovs)]];
  REGIONS.filter(r=>r!=='日本国内').forEach(r=>{const n=e.filter(x=>x.region===r).length;if(n)rows.push(['  '+r,String(n)]);});
  rows.push(['---','---']);
  AGES.forEach(a=>{const n=e.filter(x=>x.age===a).length;if(n)rows.push([a,String(n)]);});
  let y=54;
  rows.forEach(([l,v])=>{if(l==='---'){doc.setLineWidth(0.3);doc.line(20,y,190,y);y+=5;return;}doc.text(l,25,y);doc.text(v,130,y);y+=7;});
  y+=6; doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Participant Log',20,y); y+=7;
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('#',20,y); doc.text('Gender',35,y); doc.text('Age',60,y); doc.text('Region',90,y); y+=4;
  doc.setLineWidth(0.3); doc.line(20,y,190,y); y+=6; doc.setFont('helvetica','normal');
  e.forEach((x,i)=>{if(y>275){doc.addPage();y=20;}doc.text(String(i+1),20,y);doc.text(x.gender,35,y);doc.text(x.age,60,y);doc.text(x.region,90,y);y+=6;});
  doc.save('tabisaki-'+now.toISOString().slice(0,10)+'.pdf');
  showToast('PDFを発行しました');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), 2500);
}

// Init
renderAllCards();
buildToc();
updateToolbar();
</script>
</body>
</html>
